events {}
http {
    resolver kube-dns.kube-system.svc.cluster.local valid=10s;
    server {
        listen 80;
        server_name localhost;
        set $frontend "http://front.default";
        location / {
            proxy_pass $frontend;
        }
        set $backend "http://myservice.default:82/goals";
        location /goals {
            proxy_pass $backend ;
        }
    }
}