apiVersion: v1
kind: ConfigMap
metadata:
  name: maps
data:
  BACK_DNS: "http://127.0.0.1:82"

---
apiVersion: v1
kind: Service
metadata:
  name: front
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - protocol: "TCP"
    port: 80
    targetPort: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-1
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: front-conteneur
        image: mactargueye2003/front_first
        imagePullPolicy: Always
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80
        env:
        - name: REACT_APP_BACKEND_URL
          valueFrom:
            configMapKeyRef:
              name: maps
              key: BACK_DNS
                
