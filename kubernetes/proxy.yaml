apiVersion: v1
kind: Service
metadata:
  name: myproxy
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
  - port: 86
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
spec:
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx-serveur
        image: mactargueye2003/proxy
        imagePullPolicy: Always
        ports:
        - containerPort: 80
      
        
